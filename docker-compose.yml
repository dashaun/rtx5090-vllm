name: kintsugi-vllm

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    runtime: nvidia
    restart: unless-stopped
    ipc: host
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    command:
      - --model
      - nvidia/Qwen3.8-27B-NVFP4
      - --served-model-name
      - qwen3.8-27b
      - --max-model-len
      - "131072"
      - --gpu-memory-utilization
      - "0.95"
      - --kv-cache-dtype
      - fp8_e4m3
      - --max-num-seqs
      - "32"
      - --compilation-config
      - '{"cudagraph_capture_sizes": [1, 2, 4, 8, 16, 32, 64]}'
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
