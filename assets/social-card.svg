<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="rtx5090-vllm social card">
  <rect width="1280" height="640" fill="#0d1117"/>

  <!-- terminal window -->
  <rect x="64" y="140" width="520" height="360" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="92" cy="159" r="6" fill="#ff5f57"/>
  <circle cx="116" cy="159" r="6" fill="#febc2e"/>
  <circle cx="140" cy="159" r="6" fill="#28c840"/>
  <text x="164" y="164" font-family="Menlo, Monaco, monospace" font-size="14" fill="#8b949e">kintsugi  zsh</text>

  <text x="88" y="212" font-family="Menlo, Monaco, monospace" font-size="16"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> sudo ./scripts/setup.sh</tspan></text>
  <text x="88" y="244" font-family="Menlo, Monaco, monospace" font-size="16"><tspan fill="#3fb950">[ OK ]</tspan><tspan fill="#8b949e"> nvidia runtime loaded</tspan></text>
  <text x="88" y="276" font-family="Menlo, Monaco, monospace" font-size="16"><tspan fill="#3fb950">[ OK ]</tspan><tspan fill="#8b949e"> systemd unit installed</tspan></text>
  <text x="88" y="308" font-family="Menlo, Monaco, monospace" font-size="16"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> curl localhost:8000/v1/models</tspan></text>
  <text x="88" y="340" font-family="Menlo, Monaco, monospace" font-size="16"><tspan fill="#58a6ff">{</tspan><tspan fill="#8b949e"> "id": "qwen3-coder", "owned_by": "vllm" }</tspan></text>
  <text x="88" y="372" font-family="Menlo, Monaco, monospace" font-size="16"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> curl localhost:8000/v1/chat/completions</tspan></text>
  <text x="88" y="404" font-family="Menlo, Monaco, monospace" font-size="16"><tspan fill="#8b949e">{ "reply": </tspan><tspan fill="#3fb950">"ready"</tspan><tspan fill="#8b949e"> }</tspan></text>

  <!-- right column -->
  <text x="680" y="226" font-family="Menlo, Monaco, monospace" font-size="60" font-weight="700" fill="#e6edf3">rtx5090-vllm</text>
  <rect x="682" y="248" width="140" height="6" rx="3" fill="#58a6ff"/>
  <text x="680" y="300" font-family="Menlo, Monaco, monospace" font-size="26" fill="#8b949e">vLLM on an RTX 5090 via Docker</text>

  <text x="680" y="352" font-family="Menlo, Monaco, monospace" font-size="20"><tspan fill="#3fb950">&gt;</tspan><tspan fill="#e6edf3"> Qwen3-Coder-30B-A3B  INT4</tspan></text>
  <text x="680" y="392" font-family="Menlo, Monaco, monospace" font-size="20"><tspan fill="#3fb950">&gt;</tspan><tspan fill="#e6edf3"> OpenAI-compatible API  :8000</tspan></text>
  <text x="680" y="432" font-family="Menlo, Monaco, monospace" font-size="20"><tspan fill="#3fb950">&gt;</tspan><tspan fill="#e6edf3"> systemd  auto-restart on boot</tspan></text>

  <!-- GPU chip -->
  <rect x="1030" y="320" width="190" height="190" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="1125" y="350" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="17" font-weight="600" fill="#e6edf3">RTX 5090</text>
  <g fill="#58a6ff">
    <rect x="1050" y="368" width="34" height="34" rx="6"/>
    <rect x="1096" y="368" width="34" height="34" rx="6"/>
    <rect x="1142" y="368" width="34" height="34" rx="6"/>
    <rect x="1050" y="414" width="34" height="34" rx="6"/>
    <rect x="1096" y="414" width="34" height="34" rx="6"/>
    <rect x="1142" y="414" width="34" height="34" rx="6"/>
    <rect x="1050" y="460" width="34" height="34" rx="6"/>
    <rect x="1096" y="460" width="34" height="34" rx="6"/>
    <rect x="1142" y="460" width="34" height="34" rx="6"/>
  </g>
  <text x="1125" y="500" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="14" fill="#8b949e">32 GB</text>

  <text x="680" y="584" font-family="Menlo, Monaco, monospace" font-size="18" fill="#8b949e">github.com/dashaun/rtx5090-vllm</text>
</svg>
